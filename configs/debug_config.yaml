train_data:
  sample_id: Spatial_CITEseq_Tonsil1
  hires_image_key: CytAssist_FFPE_Protein_Expression_Human_Tonsil

test_data:
  sample_id: Spatial_CITEseq_Tonsil2
  hires_image_key: CytAssist_FFPE_Protein_Expression_Human_Tonsil_AddOns

image_model:
  model_type: 'resnet'
  model_name: ''
  pretrained: false
  freeze_parameters: false

hyperparameters:
  train_batch_size: 16
  test_batch_size: 16
  patch_size: 8
  epochs: 2
  learning_rate: 0.001
  target_num_genes: 100
  random_seed: 42
  use_validation: false

logging:
  use_wandb: false
  wandb_project: 'spatial_transcriptomics'
  wandb_name: 'resnet18'
